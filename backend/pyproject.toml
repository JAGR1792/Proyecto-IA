[project]
name = "proyecto-ia-backend"
version = "0.1.0"
description = "Backend para Sistema Inteligente de Planificación de Rutas de Taxis (Chapinero)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
    "networkx==3.3",
    "osmnx==1.9.4",
    "geopandas==0.14.4",
    "shapely==2.0.6",
    "pyproj==3.7.0",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "requests==2.32.3",
    "scikit-learn==1.5.1",
    "scipy==1.13.1",
    "joblib==1.4.2",
    "orjson==3.10.11",
    "python-multipart==0.0.9",
    "tqdm==4.66.5",
    "PyYAML==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501", "UP007"]
fixable = ["ALL"]
unfixable = ["ERA", "T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = """-v \
  --cov=src/grafo/modelos \
  --cov=src/grafo/validadores \
  --cov=src/agente \
  --cov=src/busqueda \
  --cov-report=term-missing \
  --cov-fail-under=80"""