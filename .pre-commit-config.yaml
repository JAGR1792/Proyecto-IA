# Hooks locales: aplican el mismo ruff que la CI antes de cada commit.
# Instalación: cd backend && pip install -r requirements-dev.txt && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
